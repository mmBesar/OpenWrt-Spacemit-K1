# Builds OpenWrt for the SpacemiT K1 target (covers OrangePi R2S + OrangePi RV2,
# plus BPI-F3 / Milk-V Jupiter / MusePi Pro) directly from the still-unmerged
# openwrt/openwrt PR #23231 (dhewg:spacemit).
#
# Save as .github/workflows/build-openwrt-spacemit-k1.yml in your own repo,
# then trigger it manually from the Actions tab (workflow_dispatch).
#
# IMPORTANT: this PR is still being force-pushed (last update: 2026-06-13).
# By default this pulls the PR's current HEAD, which can change under you.
# For a reproducible build, set `pin_commit` to a known-good commit SHA
# from the PR instead (see input below).

name: Build OpenWrt spacemit-k1 (R2S/RV2)

on:
  workflow_dispatch:
    inputs:
      pin_commit:
        description: "Commit SHA to build (leave blank to track PR #23231 HEAD)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h

      - name: Checkout OpenWrt PR #23231
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          # refs/pull/<PR>/head tracks the PR's current tip.
          # If pin_commit is set, we check that out instead in the next step.
          ref: refs/pull/23231/head
          fetch-depth: 0

      - name: Pin to a specific commit (optional, for reproducibility)
        if: ${{ github.event.inputs.pin_commit != '' }}
        run: git checkout ${{ github.event.inputs.pin_commit }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget \
            device-tree-compiler

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure target (spacemit/k1, generic multi-board device)
        run: |
          cat > .config << 'EOF'
          CONFIG_TARGET_spacemit=y
          CONFIG_TARGET_spacemit_k1=y
          CONFIG_TARGET_spacemit_k1_DEVICE_generic=y
          CONFIG_PACKAGE_luci=y
          # --- Add any further CONFIG_PACKAGE_<name>=y lines below ---
          # Example:
          # CONFIG_PACKAGE_tcpdump=y
          # CONFIG_PACKAGE_htop=y
          # Find exact names live once you have network: `apk search <term>`
          # or browse https://downloads.openwrt.org/snapshots/packages/riscv64_generic/
          EOF
          make defconfig

      - name: Build
        run: make -j$(nproc) V=s BUILD_LOG=1

      - name: Upload firmware images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-spacemit-k1-images
          if-no-files-found: warn
          path: |
            bin/targets/spacemit/k1/*.img.gz
            bin/targets/spacemit/k1/*.itb
            bin/targets/spacemit/k1/*.manifest
            bin/targets/spacemit/k1/u-boot-spacemit_k1.tar.gz

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs/

      - name: Determine release tag
        id: tag
        run: echo "tag=build-$(date +%Y%m%d-%H%M)-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "OpenWrt spacemit-k1 build ${{ steps.tag.outputs.tag }}"
          body: |
            Built from openwrt/openwrt PR #23231 (spacemit/k1 target, generic device).
            Same images boot both OrangePi R2S and OrangePi RV2 — u-boot auto-selects the DTB.
            Source commit: ${{ github.sha }}

            Unofficial personal build from an unmerged PR — not production firmware.
          files: |
            bin/targets/spacemit/k1/*.img.gz
            bin/targets/spacemit/k1/*.itb
            bin/targets/spacemit/k1/*.manifest
            bin/targets/spacemit/k1/u-boot-spacemit_k1.tar.gz
