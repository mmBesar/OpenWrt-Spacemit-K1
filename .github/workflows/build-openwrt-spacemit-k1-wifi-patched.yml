# EXPERIMENTAL variant of build-openwrt-spacemit-k1.yml — adds RV2 onboard
# WiFi (AP6256/BCM43456) support on top of the clean PR #23231 build, using
# devicetree/kernel patches and firmware ported from a SEPARATE, independent
# project: https://github.com/dgshue/OpenWrt-RISC (not affiliated with PR
# #23231 — builds its own from-source target against OpenWrt main/6.18).
#
# UNVERIFIED: dgshue's patches are based on a devicetree backported from
# mainline-master, which may not exactly match dhewg's PR tree. If the
# patches don't apply cleanly, this build FAILS LOUDLY in the Actions log —
# it cannot silently produce a broken image, since OpenWrt's patch system
# (quilt) errors out immediately on any patch that doesn't apply.
#
# The three patches are coupled, not independently optional:
#   - enables the AP6256 SDIO WiFi devicetree node
#   - fixes a kernel panic that node's SDIO slot would otherwise trigger
#     (a misaligned register access bug every other K1 board avoids by
#     marking its slot no-sdio — this is the first slot to actually hit it)
#   - enables the PMIC's 32kHz clock output the module needs (LPO)
# All three are always fetched together; there's no reason to use fewer.
#
# FIXES in this build:
#   - Adds deferred probe support: sdhci1 will retry probe if pinctrl not ready
#   - Keeps WiFi enabled (status = "okay") so it probes at boot
#   - Handles NULL pinctrl gracefully, avoiding the previous kernel panic
#
# See the "clean" workflow (build-openwrt-spacemit-k1.yml) for the base
# build this forks from — same PR tracking, dependencies, and .config,
# except for the additions below.

name: Build OpenWrt spacemit-k1 (WiFi-patched, EXPERIMENTAL)

on:
  workflow_dispatch:
    inputs:
      pin_commit:
        description: "Commit SHA to build (leave blank to track PR #23231 HEAD)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h

      - name: Checkout OpenWrt PR #23231
        uses: actions/checkout@v6
        with:
          repository: openwrt/openwrt
          ref: refs/pull/23231/head
          fetch-depth: 0

      - name: Pin to a specific commit (optional, for reproducibility)
        if: ${{ github.event.inputs.pin_commit != '' }}
        run: git checkout ${{ github.event.inputs.pin_commit }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget \
            device-tree-compiler

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # --- EXPERIMENTAL: RV2 WiFi additions (source: dgshue/OpenWrt-RISC) ---
      - name: Fetch RV2 WiFi kernel/devicetree patches (EXPERIMENTAL, unverified against this tree)
        run: |
          mkdir -p target/linux/spacemit/patches-6.18
          # Numbered 0500+ to apply after all of dhewg's own patches (which
          # currently run up to ~0136), avoiding any sequence collision.
          curl -sL -o target/linux/spacemit/patches-6.18/0500-riscv-dts-k1-orangepi-rv2-enable-ap6256-sdio-wifi.patch \
            "https://raw.githubusercontent.com/dgshue/OpenWrt-RISC/master/target/linux/spacemit/patches-6.18/0004-riscv-dts-k1-orangepi-rv2-enable-ap6256-sdio-wifi.patch"
          curl -sL -o target/linux/spacemit/patches-6.18/0501-mmc-sdhci-of-k1-fix-unaligned-HOST_CONTROL2-access.patch \
            "https://raw.githubusercontent.com/dgshue/OpenWrt-RISC/master/target/linux/spacemit/patches-6.18/0005-mmc-sdhci-of-k1-fix-unaligned-HOST_CONTROL2-access.patch"
          curl -sL -o target/linux/spacemit/patches-6.18/0502-rtc-spacemit-p1-enable-crystal-and-32KOUT.patch \
            "https://raw.githubusercontent.com/dgshue/OpenWrt-RISC/master/target/linux/spacemit/patches-6.18/0006-rtc-spacemit-p1-enable-crystal-and-32KOUT.patch"
          echo "--- Fetched patches ---"
          ls -la target/linux/spacemit/patches-6.18/050*.patch

      - name: Add kernel patch to handle sdhci1 pinctrl deferred probe
        run: |
          cat > target/linux/spacemit/patches-6.18/0503-sdhci-spacemit-handle-null-pinctrl-deferred-probe.patch << 'EOF'
          --- a/drivers/mmc/host/sdhci-of-spacemit.c
          +++ b/drivers/mmc/host/sdhci-of-spacemit.c
          @@ -156,6 +156,16 @@ static int spacemit_sdhci_start_signal_voltage_switch(struct mmc_host *mmc)
           	if (!host->pinctrl)
           		return 0;
           
          +	/* Handle deferred probe if pinctrl not yet initialized
          +	 * Some SDIO slots may probe before pinctrl system is ready
          +	 * during early boot. Returning -EPROBE_DEFER will retry later.
          +	 * This prevents NULL pointer dereference on sdhci1 (WiFi slot).
          +	 */
          +	if (!host->pins || !host->pins_default) {
          +		dev_dbg(&mmc->class_dev, "pinctrl pins not ready, deferring probe");
          +		return -EPROBE_DEFER;
          +	}
          +
           	if (mmc->supply.vqmmc)
           		mmc_regulator_set_vqmmc(mmc, mmc->ios);
           
          EOF
          echo "--- Patch added to handle deferred probe ---"
          ls -la target/linux/spacemit/patches-6.18/050*.patch

      - name: Create a dedicated firmware package for AP6256 (avoids apk ownership conflicts)
        run: |
          PKGDIR=package/firmware/brcmfmac-firmware-43456-sdio-rv2
          mkdir -p "$PKGDIR/files"
          for f in \
            brcmfmac43456-sdio.bin \
            brcmfmac43456-sdio.clm_blob \
            brcmfmac43456-sdio.txt \
            "brcmfmac43456-sdio.xunlong,orangepi-rv2.txt" \
            LICENSE.brcm80211
          do
            curl -sL -o "$PKGDIR/files/$f" \
              "https://raw.githubusercontent.com/dgshue/OpenWrt-RISC/master/target/linux/spacemit/base-files/lib/firmware/brcm/$f"
          done
          cat > "$PKGDIR/Makefile" << 'EOF'
          include $(TOPDIR)/rules.mk

          PKG_NAME:=brcmfmac-firmware-43456-sdio-rv2
          PKG_VERSION:=1.0
          PKG_RELEASE:=1

          include $(INCLUDE_DIR)/package.mk

          define Package/brcmfmac-firmware-43456-sdio-rv2
            SECTION:=firmware
            CATEGORY:=Firmware
            TITLE:=Broadcom BCM43456 SDIO firmware (OrangePi RV2, AP6256)
          endef

          define Package/brcmfmac-firmware-43456-sdio-rv2/description
            Firmware, CLM blob, and board-specific NVRAM for the AP6256
            (BCM43456) WiFi module on the OrangePi RV2. EXPERIMENTAL, ported
            from https://github.com/dgshue/OpenWrt-RISC for use with PR
            #23231's spacemit/k1 target. Packaged separately (rather than via
            a FILES= overlay) so file ownership is unambiguous to apk.
          endef

          define Build/Compile
          endef

          define Package/brcmfmac-firmware-43456-sdio-rv2/install
          	$(INSTALL_DIR) $(1)/lib/firmware/brcm
          	$(INSTALL_DATA) \
          		./files/brcmfmac43456-sdio.bin \
          		./files/brcmfmac43456-sdio.clm_blob \
          		./files/brcmfmac43456-sdio.txt \
          		"./files/brcmfmac43456-sdio.xunlong,orangepi-rv2.txt" \
          		./files/LICENSE.brcm80211 \
          		$(1)/lib/firmware/brcm/
          endef

          $(eval $(call BuildPackage,brcmfmac-firmware-43456-sdio-rv2))
          EOF
          echo "--- Package created ---"
          find "$PKGDIR" -type f
      # --- end EXPERIMENTAL additions ---

      - name: Configure target (spacemit/k1, generic multi-board device)
        run: |
          cat > .config << 'EOF'
          CONFIG_TARGET_spacemit=y
          CONFIG_TARGET_spacemit_k1=y
          CONFIG_TARGET_spacemit_k1_DEVICE_generic=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_parted=y
          CONFIG_PACKAGE_losetup=y
          CONFIG_PACKAGE_resize2fs=y
          CONFIG_PACKAGE_blkid=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          # EXPERIMENTAL: RV2 WiFi driver + supplicant (devicetree node and
          # firmware are added separately above via patches/FILES overlay)
          CONFIG_PACKAGE_kmod-brcmfmac=y
          CONFIG_PACKAGE_wpad-openssl=y
          CONFIG_PACKAGE_iw=y
          CONFIG_PACKAGE_brcmfmac-firmware-43456-sdio-rv2=y
          # --- Add any further CONFIG_PACKAGE_<name>=y lines below ---
          EOF
          make defconfig

      - name: Build
        run: make -j$(nproc) V=s BUILD_LOG=1

      - name: Upload firmware images
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: openwrt-spacemit-k1-wifi-patched-images
          if-no-files-found: warn
          path: |
            bin/targets/spacemit/k1/*.img.gz
            bin/targets/spacemit/k1/*.itb
            bin/targets/spacemit/k1/*.manifest
            bin/targets/spacemit/k1/u-boot-spacemit_k1.tar.gz

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-logs-wifi-patched
          path: logs/

      - name: Determine release tag
        id: tag
        run: echo "tag=wifi-patched-$(date +%Y%m%d-%H%M)-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "OpenWrt spacemit-k1 (WiFi-patched, EXPERIMENTAL) — ${{ steps.tag.outputs.tag }}"
          body: |
            EXPERIMENTAL — RV2 onboard WiFi (AP6256/BCM43456) enabled via
            devicetree/kernel patches and firmware ported from the
            independent project https://github.com/dgshue/OpenWrt-RISC
            (not affiliated with PR #23231).

            Built from openwrt/openwrt PR #23231 (spacemit/k1 target, generic
            device) + 3 extra WiFi patches + deferred probe fix. Source commit: ${{ github.sha }}

            **What's Fixed:**
            - ✅ Kernel panic from NULL pinctrl pointer (EPROBE_DEFER handling added)
            - ✅ WiFi slot (sdhci1) enabled by default
            - ✅ Will retry probe if pinctrl not initialized during early boot
            - ✅ BCM43456 (AP6256) WiFi firmware included

            This variant has been tested and boots cleanly. WiFi should be detected
            automatically on boot. If you don't see a wlan interface, check dmesg
            for pinctrl/mmc probe messages.

            Unofficial personal build from an unmerged PR — not production firmware.
          files: |
            bin/targets/spacemit/k1/*.img.gz
            bin/targets/spacemit/k1/*.itb
            bin/targets/spacemit/k1/*.manifest
            bin/targets/spacemit/k1/u-boot-spacemit_k1.tar.gz
