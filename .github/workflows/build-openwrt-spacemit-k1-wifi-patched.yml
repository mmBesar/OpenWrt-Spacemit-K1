# EXPERIMENTAL variant of build-openwrt-spacemit-k1.yml — adds RV2 onboard
# WiFi (AP6256/BCM43456) support on top of the clean PR #23231 build.
#
# SUPERSEDES an earlier version of this workflow that grafted
# dgshue/OpenWrt-RISC's WiFi devicetree patch onto this tree directly.
# That caused a REAL kernel panic on SD card boot — his patch was written
# against his own devicetree backport, not dhewg's actual structure, and
# the insertion landed in a structurally different place than intended.
#
# This version uses 0500-rv2-wifi-devicetree-adapted.patch instead — hand-
# built against a real reconstruction of dhewg's current tree (all 137 of
# his patches applied against the actual pinned kernel source), and
# verified via a real dtc compile before ever being tried on hardware. See
# that patch file's own header for the full verification trail. Only
# dgshue's patches 0005 (SDIO panic fix) and 0006 (PMIC clock enable) are
# still pulled from his repo directly — both apply cleanly as-is and don't
# touch board-specific structure, so they don't carry the same risk 0004 did.
#
# STILL UNVERIFIED: real hardware boot. Structural correctness is confirmed;
# actual silicon behavior is not, until this has been tried on a board.

name: Build OpenWrt spacemit-k1 (WiFi-patched, EXPERIMENTAL)

on:
  workflow_dispatch:
    inputs:
      pin_commit:
        description: "Commit SHA to build (leave blank to track PR #23231 HEAD)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h

      - name: Checkout OpenWrt PR #23231
        uses: actions/checkout@v6
        with:
          repository: openwrt/openwrt
          ref: refs/pull/23231/head
          fetch-depth: 0

      - name: Checkout this repo too (for our own patch file)
        uses: actions/checkout@v6
        with:
          path: this-repo

      - name: Pin to a specific commit (optional, for reproducibility)
        if: ${{ github.event.inputs.pin_commit != '' }}
        run: git checkout ${{ github.event.inputs.pin_commit }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget \
            device-tree-compiler

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add our own hand-verified WiFi devicetree patch
        run: |
          cp this-repo/.github/patches/0500-rv2-wifi-devicetree-adapted.patch \
            target/linux/spacemit/patches-6.18/

      - name: Fetch the two companion fixes (panic fix + PMIC clock) — apply cleanly as-is, board-agnostic
        run: |
          curl -sL -f -o target/linux/spacemit/patches-6.18/0501-mmc-sdhci-of-k1-fix-unaligned-HOST_CONTROL2-access.patch \
            "https://raw.githubusercontent.com/dgshue/OpenWrt-RISC/master/target/linux/spacemit/patches-6.18/0005-mmc-sdhci-of-k1-fix-unaligned-HOST_CONTROL2-access.patch"
          curl -sL -f -o target/linux/spacemit/patches-6.18/0502-rtc-spacemit-p1-enable-crystal-and-32KOUT.patch \
            "https://raw.githubusercontent.com/dgshue/OpenWrt-RISC/master/target/linux/spacemit/patches-6.18/0006-rtc-spacemit-p1-enable-crystal-and-32KOUT.patch"
          echo "--- All WiFi patches now in place ---"
          ls -la target/linux/spacemit/patches-6.18/050*.patch

      - name: Create a dedicated firmware package for AP6256 (avoids apk ownership conflicts)
        run: |
          PKGDIR=package/firmware/brcmfmac-firmware-43456-sdio-rv2
          mkdir -p "$PKGDIR/files"
          for f in \
            brcmfmac43456-sdio.bin \
            brcmfmac43456-sdio.clm_blob \
            brcmfmac43456-sdio.txt \
            "brcmfmac43456-sdio.xunlong,orangepi-rv2.txt" \
            LICENSE.brcm80211
          do
            curl -sL -f -o "$PKGDIR/files/$f" \
              "https://raw.githubusercontent.com/dgshue/OpenWrt-RISC/master/target/linux/spacemit/base-files/lib/firmware/brcm/$f"
          done
          cat > "$PKGDIR/Makefile" << 'EOF'
          include $(TOPDIR)/rules.mk

          PKG_NAME:=brcmfmac-firmware-43456-sdio-rv2
          PKG_VERSION:=1.0
          PKG_RELEASE:=1

          include $(INCLUDE_DIR)/package.mk

          define Package/brcmfmac-firmware-43456-sdio-rv2
            SECTION:=firmware
            CATEGORY:=Firmware
            TITLE:=Broadcom BCM43456 SDIO firmware (OrangePi RV2, AP6256)
          endef

          define Package/brcmfmac-firmware-43456-sdio-rv2/description
            Firmware, CLM blob, and board-specific NVRAM for the AP6256
            (BCM43456) WiFi module on the OrangePi RV2. Firmware blobs sourced
            from https://github.com/dgshue/OpenWrt-RISC; devicetree enablement
            is this project's own, independently verified adaptation — see
            0500-rv2-wifi-devicetree-adapted.patch for the full verification
            trail. Packaged separately (rather than via a FILES= overlay) so
            file ownership is unambiguous to apk.
          endef

          define Build/Compile
          endef

          define Package/brcmfmac-firmware-43456-sdio-rv2/install
          	$(INSTALL_DIR) $(1)/lib/firmware/brcm
          	$(INSTALL_DATA) \
          		./files/brcmfmac43456-sdio.bin \
          		./files/brcmfmac43456-sdio.clm_blob \
          		./files/brcmfmac43456-sdio.txt \
          		"./files/brcmfmac43456-sdio.xunlong,orangepi-rv2.txt" \
          		./files/LICENSE.brcm80211 \
          		$(1)/lib/firmware/brcm/
          endef

          $(eval $(call BuildPackage,brcmfmac-firmware-43456-sdio-rv2))
          EOF
          echo "--- Package created ---"
          find "$PKGDIR" -type f

      - name: Configure target (spacemit/k1, generic multi-board device)
        run: |
          cat > .config << 'EOF'
          CONFIG_TARGET_spacemit=y
          CONFIG_TARGET_spacemit_k1=y
          CONFIG_TARGET_spacemit_k1_DEVICE_generic=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_parted=y
          CONFIG_PACKAGE_losetup=y
          CONFIG_PACKAGE_resize2fs=y
          CONFIG_PACKAGE_blkid=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-brcmfmac=y
          CONFIG_PACKAGE_wpad-openssl=y
          CONFIG_PACKAGE_iw=y
          CONFIG_PACKAGE_brcmfmac-firmware-43456-sdio-rv2=y
          # --- Add any further CONFIG_PACKAGE_<name>=y lines below ---
          EOF
          make defconfig

      - name: Build
        run: make -j$(nproc) V=s BUILD_LOG=1

      - name: Upload firmware images
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: openwrt-spacemit-k1-wifi-patched-images
          if-no-files-found: warn
          path: |
            bin/targets/spacemit/k1/*.img.gz
            bin/targets/spacemit/k1/*.itb
            bin/targets/spacemit/k1/*.manifest
            bin/targets/spacemit/k1/u-boot-spacemit_k1.tar.gz

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-logs-wifi-patched
          path: logs/

      - name: Determine release tag
        id: tag
        run: echo "tag=wifi-patched-$(date +%Y%m%d-%H%M)-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "OpenWrt spacemit-k1 (WiFi-patched, EXPERIMENTAL) — ${{ steps.tag.outputs.tag }}"
          body: |
            EXPERIMENTAL — RV2 onboard WiFi (AP6256/BCM43456).

            Devicetree changes are this project's own patch, independently
            verified against dhewg's actual current tree (not grafted from
            another repo's file layout — an earlier attempt at that caused a
            real SD-card boot panic). See 0500-rv2-wifi-devicetree-adapted.patch
            for the full verification trail. The SDIO panic fix and PMIC clock
            enable are pulled from https://github.com/dgshue/OpenWrt-RISC directly,
            since those apply cleanly as-is and aren't board-structure-specific.
            Firmware blobs also sourced from that project.

            Built from openwrt/openwrt PR #23231 (spacemit/k1 target, generic
            device). Source commit: ${{ github.sha }}

            Structural/compile verification only — NOT yet confirmed on real
            hardware. Unofficial personal build from an unmerged PR.
          files: |
            bin/targets/spacemit/k1/*.img.gz
            bin/targets/spacemit/k1/*.itb
            bin/targets/spacemit/k1/*.manifest
            bin/targets/spacemit/k1/u-boot-spacemit_k1.tar.gz
